name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/myapp
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/myapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production build
        run: pnpm run verify:build

  api-regression:
    name: API regression (Nest + seed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ShopDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            backend/myapp/pnpm-lock.yaml
            frontend/myapp/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend/myapp
        run: pnpm install --frozen-lockfile

      - name: Configure backend env
        working-directory: backend/myapp
        run: |
          cat > .env <<'EOF'
          PORT=3000
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=root
          DB_NAME=ShopDB
          JWT_SECRET=ci-test-jwt-secret
          JWT_REFRESH_SECRET=ci-test-jwt-refresh-secret
          CORS_ORIGINS=http://localhost:5173
          EOF

      - name: Build and start API
        working-directory: backend/myapp
        run: |
          pnpm run build
          pnpm run start:prod &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Seed demo data
        working-directory: backend/myapp
        run: pnpm run seed:demo

      - name: Install frontend dependencies
        working-directory: frontend/myapp
        run: pnpm install --frozen-lockfile

      - name: Run API regression
        working-directory: frontend/myapp
        env:
          API_BASE: http://localhost:3000
        run: pnpm run verify:regression
